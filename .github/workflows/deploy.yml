name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Не знайдено секрет HF_TOKEN! Будь ласка, додайте токен від Hugging Face в Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          git config --global user.email "bot@huggingface.co"
          git config --global user.name "Hugging Face Deploy Bot"
          git remote add space https://kompotisk:$HF_TOKEN@huggingface.co/spaces/kompotisk/Garden
          git push --force space main
